name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Kunci tanda tangan tetap
        run: |
          if [ ! -f app/dhanytv.keystore ]; then
            keytool -genkeypair -keystore app/dhanytv.keystore -storepass android -keypass android \
              -alias dhanytv -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=DhanyTV"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add app/dhanytv.keystore
            git commit -m "Kunci tanda tangan APK"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - name: Terbitkan APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DhanyTV.apk
          gh release delete latest --yes --cleanup-tag || true
          {
            echo "## DhanyTV APK"
            echo "Dibangun otomatis dari panel admin: build #${{ github.run_number }}, $(date -u +'%d %b %Y %H:%M UTC')."
            echo
            echo "**Cara pasang:** unduh DhanyTV.apk, izinkan pemasangan dari sumber tidak dikenal, lalu buka."
            echo "Di TV: ketik alamat server + /apk di browser atau aplikasi Downloader."
          } > notes.md
          gh release create latest DhanyTV.apk --title "DhanyTV APK terbaru" --notes-file notes.md
