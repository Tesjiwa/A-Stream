name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pastikan dhanytv.html terbungkus di APK
        run: |
          if [ ! -s app/src/main/assets/index.html ]; then
            echo "app/src/main/assets/index.html tidak ada. Bangun APK dari panel admin (Pembuat APK) agar dhanytv.html ikut dibungkus."
            exit 1
          fi
          grep -q "var GH_REPO=" app/src/main/assets/index.html || { echo "index.html bukan dhanytv.html yang benar"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Kunci tanda tangan tetap
        run: |
          if [ ! -f app/dhanytv.keystore ]; then
            keytool -genkeypair -keystore app/dhanytv.keystore -storepass android -keypass android \
              -alias dhanytv -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=DhanyTV"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add app/dhanytv.keystore
            git commit -m "Kunci tanda tangan APK"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - name: Terbitkan APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk A-Stream.apk
          gh release delete latest --yes --cleanup-tag || true
          {
            echo "## A-Stream APK"
            echo "Dibangun otomatis dari panel admin: build #${{ github.run_number }}, $(date -u +'%d %b %Y %H:%M UTC')."
            echo
            echo "**Cara pasang:** unduh A-Stream.apk, izinkan pemasangan dari sumber tidak dikenal, lalu buka."
            echo "Di TV: ketik alamat server + /apk di browser atau aplikasi Downloader."
          } > notes.md
          gh release create latest A-Stream.apk --title "A-Stream APK terbaru" --notes-file notes.md
