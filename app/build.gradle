plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dhanytv.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dhanytv.app'
        minSdk 23
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName '1.4'
    }
    // Kunci tanda tangan tetap (dibuat otomatis sekali oleh workflow) supaya APK baru bisa menimpa yang lama
    signingConfigs {
        dtv {
            storeFile file('dhanytv.keystore')
            storePassword 'android'
            keyAlias 'dhanytv'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig file('dhanytv.keystore').exists() ? signingConfigs.dtv : signingConfigs.debug
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
